name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Dummy values: the build never connects to the DB, but the modules
          # validate that these are present at load time.
          AUTH_SECRET: ci-build-secret-ci-build-secret-32
          DATABASE_URL: postgres://user:pass@localhost:5432/db
